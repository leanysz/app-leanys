<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App</title>
    <style>

      body {
        background-color: rgb(251, 174, 202);
        margin: 0;
        padding: 0;
      }

      /* Menu de navegação */

      .faixa {
        background-color: rgb(73, 73, 73);
        position: fixed;
        top: 0;
        width: 100%;
        height: 1.7cm;
        display: flex;
        justify-content: space-between; 
        padding: 0 20px;
        align-items: center;
        box-sizing: border-box; 
      }

      h1 {
        color: rgb(255, 255, 255);
        margin: 0; 
      }

      nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        gap: 20px;
      }

      nav li {
        margin-left: 20px;
      }

      nav a {
        text-decoration: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        transition: color 0.3s;
      }

      nav a:hover {
        color: rgb(158, 128, 221);
      }

      /* Conteudo */

      img {
        width: 150px; 
        height: auto;
        margin-top: 200px;
      }

      button {
        position: absolute;
        top: 90px;
        left: 10px;
        padding: 10px;
        background-color: rgb(158, 128, 221);
        border: none;
        cursor: pointer;
      }

      input {
        position: absolute;
        top: 150px;
        left: 10px;
        padding: 5px;
        width: 200px;
      }

  </style> 
</head>
<body>

  <!-- Faixa com o nome e o menu -->

  </nav>
 </div>
