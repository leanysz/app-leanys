<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões de Matemática - ENEM</title>
    <style>

        /* Estilo para a questão */

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 50px auto 50px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .container h2{
            color: #333;
            font-size: 22px;
            text-align: center;
            margin-bottom: 0;
            border-bottom: 3px solid #3f51b5;
            padding-bottom: 10px;
            font-family: 'Poppins';
            text-transform: none;
        }

        .container h3{
            color: #333;
            font-size: 18px;
            text-align: center;
            font-family: 'Poppins';
            text-transform: none;
        }

        .container p{
            text-align:justify;
            margin-bottom: 16px;
            font-size: 16px;
            color: #555;
            width:100%;
        }

        /* Estilo do botão para selecionar alternativas */
        .btn-alternativa {
            display: block;
            width: 100%;
            padding: 15px; /* Aumenta o padding para melhorar a área clicável */
            margin: 8px 0;
            font-size: 18px;
            background-color: #ffffff;
            color: #333;
            border: 2px solid #3f51b5; /* Borda azul suave para um visual mais moderno */
            border-radius: 8px; /* Bordas arredondadas */
            cursor: pointer;
            text-transform: none;
            transition: all 0.3s ease; /* Suaviza as transições */
            margin-bottom: 12px; /* Ajuste o espaçamento entre os botões */
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Adiciona uma sombra suave ao redor do botão */
        }          
            

        .btn-alternativa:hover {
            background-color: #ffffff;  /* Altere para branco */
            border-color: #2c387c; /* Escurece a borda para dar um efeito de foco */
            transform: translateY(-2px); /* Levanta o botão um pouco ao passar o mouse */
        }
       
        .btn-alternativa:active {
            transform: translateY(1px); 
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }
        
        .btn-selecionado {
            background-color: #3f51b5;; /* Cor verde quando selecionado */
            border-color: #2c387c; /* Ajuste da cor da borda quando selecionado */
            color: white; /* Torna o texto branco */
        }   
        
        #btn-enviar {
            width: 100%;
            padding: 15px;
            background-color: #3f51b5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        #btn-enviar:disabled {
            background-color: #ccc;
        }

        #btn-enviar:hover {
            background-color: #2c387c;
        }

        #resultado {
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
        }

        /* Imagem nas alternativas */
        .imagem {
            max-width: 100%;
            height: auto;
            width: auto
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
                margin: 20px;
            }

            h2 {
                font-size: 22px;
            }

            h3 {
                font-size: 18px;
            }

            .btn-alternativa {
                font-size: 16px;
            }
        }

        /* Estilo para as alternativas */
        .alternativas {
            list-style: none;
            padding: 0;
            width: 100%;
        }

        
    </style>
</head>

<body>

  <div id="header"></div>

    <script>
        fetch('static/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });
    </script> 

 <div class="container">
    <h2>Questões de Matemática</h2>
    <h3>{{ questao["title"] }}</h3> 
    <p>{{ questao["context"] | safe }}</p>  
    <p>{{ questao["alternativesIntroduction"] }}</p>
    <ul class="alternativas">
        <li>
            <button class="btn-alternativa" onclick="selecionarAlternativa(this, 'A')">
                <span class="letra">A)</span>
                {% if questao["alternatives"][0]["text"] %}
                    <span class="texto">{{ questao["alternatives"][0]["text"] }}</span>
                {% else %}
                    <img src="{{ questao['alternatives'][0]['file'] }}" class="imagem">
                {% endif %}
            </button>
        </li>
        <li>
            <button class="btn-alternativa" onclick="selecionarAlternativa(this, 'B')">
                <span class="letra">B)</span>
                {% if questao["alternatives"][1]["text"] %}
                    <span class="texto">{{ questao["alternatives"][1]["text"] }}</span>
                {% else %}
                    <img src="{{ questao['alternatives'][1]['file'] }}" class="imagem">
                {% endif %}
            </button>
        </li>
        <li>
            <button class="btn-alternativa" onclick="selecionarAlternativa(this, 'C')">
                <span class="letra">C)</span>
                {% if questao["alternatives"][2]["text"] %}
                    <span class="texto">{{ questao["alternatives"][2]["text"] }}</span>
                {% else %}
                    <img src="{{ questao['alternatives'][2]['file'] }}" class="imagem">
                {% endif %}
            </button>
        </li>
        <li>
            <button class="btn-alternativa" onclick="selecionarAlternativa(this, 'D')">
                <span class="letra">D)</span>
                {% if questao["alternatives"][3]["text"] %}
                    <span class="texto">{{ questao["alternatives"][3]["text"] }}</span>
                {% else %}
                    <img src="{{ questao['alternatives'][3]['file'] }}" class="imagem">
                {% endif %}
            </button>
        </li>
        <li>
            <button class="btn-alternativa" onclick="selecionarAlternativa(this, 'E')">
                <span class="letra">E)</span>
                {% if questao["alternatives"][4]["text"] %}
                    <span class="texto">{{ questao["alternatives"][4]["text"] }}</span>
                {% else %}
                    <img src="{{ questao['alternatives'][4]['file'] }}" class="imagem">
                {% endif %}
            </button>
        </li>
    </ul>    
    <button id="btn-enviar" class="btn btn-success mb-3" onclick="verificarResposta()" disabled>Enviar</button>
    <p id="resultado"></p>
</div>
    
<script>
    let alternativaSelecionada = null;

    function selecionarAlternativa(botao, alternativa) {
        const botoes = document.querySelectorAll('.btn-alternativa');
        botoes.forEach(b => b.classList.remove('btn-selecionado'));

        botao.classList.add('btn-selecionado');
        alternativaSelecionada = alternativa;

        document.getElementById("btn-enviar").disabled = false; // Habilita o botão "Enviar"
    }

    function verificarResposta() {
        const respostaCorreta = document.querySelector('.container').getAttribute('data-resposta');
        const resultado = document.getElementById("resultado");

        if (alternativaSelecionada === respostaCorreta) {
            resultado.textContent = "Parabéns, você acertou!";
            resultado.style.color = "green";
        } else {
            resultado.textContent = "Que pena, tente novamente!";
            resultado.style.color = "red";
        }
        resultado.style.display = "block";
    }
</script>

</body>
</html>
