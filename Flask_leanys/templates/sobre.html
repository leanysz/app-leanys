<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre</title>
    <style>

        body {
            background-color: rgb(251, 174, 202);
            margin: 0;
            padding: 0;
        } 

        .faixa {
            background-color: rgb(73, 73, 73);
            position: fixed;
            top: 0;
            width: 100%;
            height: 1.7cm;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }

        h1 {
            color: rgb(255, 255, 255);
            margin: 0;
            z-index: 1001;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 20px;
        }

        nav li {
            margin-left: 20px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s;
            z-index: 1001
        }

        nav a:hover {
            color: rgb(158, 128, 221);
        }
      
      /* Conteudo */

    </style>
</head>
<body>

    <!-- Faixa com o nome e o menu -->

 <div class="faixa">
    <h1>Nome do App</h1>
    
    <nav>
      <ul>
          <li><a href="/">Início</a></li>
          <li><a href="/sobre.html">Sobre</a></li>
          <li><a href="/contato.html">Contato</a></li>
      </ul>
    </nav>
   </div> 

   <!-- Conteudo -->
    
</body>
</html>
