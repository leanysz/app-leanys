<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lu.css">

    <style>

      /* Estilo global */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #dbdbdb;
            margin: 0;
            padding: 0;
            color: #333;
        }

        h1, h2 {
            font-family: 'Lilita One', sans-serif;
            color: #3d3d3d;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Faixa de navegação */

        .nav-bar {
            background-image: linear-gradient(to bottom, #101010 0.1px, #000000);
            display: flex;
            justify-content: space-between;  /* Espaço entre logo e links */
            align-items: center;  /* Alinha a logo e os links verticalmente */
            padding: 15px 0;
            height: 60px;
        }

        .nav-bar .logo {
            height: 80px;  /* Ajuste o tamanho do logo conforme necessário */
            width: auto;   /* Mantém a proporção da imagem */
            margin-left: 40px;
        }

        .pontos-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgb(49, 178, 242 );
            font-weight: bold;
            margin-left: 20px;
        }

        .moeda {
            width: 40px; /* Tamanho da moeda */
            height: auto;
        }

        .nav-bar .links {
            margin-left: auto;
        }

        .nav-bar a {
            color: white;
            font-weight: bold;
            padding: 10px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .nav-bar a:hover {
            background-color: #4f4f4f;   
        }      

        /* Responsividade */
        @media (max-width: 768px) {
            .nav-bar {
                flex-direction: column;
                gap: 10px;
            }

            .container {
                padding: 20px;
            }
        }

    </style>
</head>

<body>
